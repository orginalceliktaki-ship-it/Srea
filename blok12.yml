          package com.blok.yardimci

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.WindowManager
          import java.nio.ByteBuffer

          class CaptureService : Service() {
              private class Pending(val move: Move, val before: IntArray) {
                  @Volatile var ax = 0.0
                  @Volatile var ay = 0.0
                  @Volatile var measured = false
                  @Volatile var ghost = false
                  var lastRes: FloatArray? = null
                  var lastX = -1f
                  var lastY = -1f
                  @Volatile var released = false
                  var probe = 0.0
              }

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var vd: VirtualDisplay? = null
              private var overlay: OverlayView? = null
              private var wm: WindowManager? = null

              private val thread = HandlerThread("blok-capture")
              private lateinit var handler: Handler
              private val ui = Handler(Looper.getMainLooper())
              private val analyzer = Analyzer()

              @Volatile private var running = false
              @Volatile private var busyUntil = 0L
              @Volatile private var dirty = true
              @Volatile private var stable = 0
              @Volatile private var corr = ""

              // Son değişen kare (ekran durağanlaşınca bunun üzerinde analiz yapılır)
              private var stored: ByteArray? = null
              private var sRs = 0
              private var sPs = 4
              private var sW = 0
              private var sH = 0
              private var lastHash = 0L
              private var lastAnalysis = 0L
              private var overlayEmpty = true

              // Otomatik oynama
              private var auto = false
              private lateinit var learner: Learner
              @Volatile private var probeY = 0.0
              private lateinit var cfg: android.content.SharedPreferences
              private var refArr: ByteArray? = null
              private var lastRd: Reading? = null
              private var liftSlot = -1
              private var liftA: DoubleArray? = null
              private var liftB: DoubleArray? = null
              @Volatile private var teachN = 0
              private var candIdx = 0
              private var fails = 0
              private var pending: Pending? = null
              private var autoNote = ""
              @Volatile private var askUntil = 0L
              private var askBoard: IntArray? = null
              private var askPieces: List<Piece> = emptyList()
              private var askMove = -1
              private val offs = doubleArrayOf(0.0, -140.0, -280.0, 140.0, -420.0, -70.0)

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try {
                          step()
                      } catch (e: Throwable) {
                          // Tek kare hatası servisi durdurmasın
                      }
                      handler.postDelayed(this, 150)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (running) return START_NOT_STICKY
                  startForegroundCompat()

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  auto = intent?.getBooleanExtra("auto", false) ?: false
                  @Suppress("DEPRECATION")
                  val data = intent?.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val prefs = getSharedPreferences("cal", Context.MODE_PRIVATE)
                  learner = Learner(this)
                  cfg = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  learner.seed(prefs.getFloat("offX", 0f).toDouble(), prefs.getFloat("offY", 0f).toDouble())

                  thread.start()
                  handler = Handler(thread.looper)

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          ui.post { stopSelf() }
                      }
                  }, handler)

                  val windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = windowManager
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(dm)
                  val w = dm.widthPixels
                  val h = dm.heightPixels

                  val ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  reader = ir
                  vd = proj.createVirtualDisplay(
                      "blok-cap", w, h, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      ir.surface, null, handler
                  )

                  val ov = OverlayView(this)
                  overlay = ov
                  val lp = WindowManager.LayoutParams(
                      w, h,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 0
                  lp.y = 0
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  windowManager.addView(ov, lp)

                  running = true
                  handler.postDelayed(tick, 500)
                  return START_NOT_STICKY
              }

              /**
               * Her 150 ms'de yeni kare varsa seyrek örneklerle özet çıkarır (çok ucuz).
               * Ekran değiştiyse kareyi saklar, durağanlaşınca (2 ölçüm aynı) tam analizi bir kez çalıştırır.
               */
              private fun step() {
                  val now = SystemClock.uptimeMillis()
                  if (now < busyUntil) return
                  val r = reader ?: return
                  val img = r.acquireLatestImage()
                  if (img != null) {
                      try {
                          val plane = img.planes[0]
                          val buf = plane.buffer
                          val fr = Frame(buf, plane.rowStride, plane.pixelStride, img.width, img.height)
                          val hsh = analyzer.quickHash(fr)
                          if (hsh != lastHash || stored == null) {
                              lastHash = hsh
                              stable = 0
                              dirty = true
                              buf.rewind()
                              val n = buf.remaining()
                              var arr = stored
                              if (arr == null || arr.size < n) {
                                  arr = ByteArray(n)
                                  stored = arr
                              }
                              buf.get(arr, 0, n)
                              sRs = plane.rowStride
                              sPs = plane.pixelStride
                              sW = img.width
                              sH = img.height
                              if (pending == null && teachOn()) {
                                  try { observe() } catch (e: Throwable) {}
                              }
                          } else {
                              stable++
                          }
                      } finally {
                          img.close()
                      }
                  } else {
                      stable++
                  }
                  if (!dirty) return
                  if (stable < 2 && now - lastAnalysis < 1200) return
                  val arr = stored ?: return
                  dirty = false
                  lastAnalysis = now
                  process(Frame(ByteBuffer.wrap(arr), sRs, sPs, sW, sH))
              }

              private fun process(frame: Frame) {
                  val la0 = liftA
                  if (la0 != null && SystemClock.uptimeMillis() - la0[2] < 500) {
                      dirty = true
                      return
                  }
                  val rd = analyzer.analyze(frame)
                  if (rd == null) {
                      pending = null
                      if (!overlayEmpty) {
                          overlayEmpty = true
                          ui.post { overlay?.update(emptyList(), 0.0, 0.0, 1.0, "") }
                      }
                      return
                  }

                  // Elle yerleştirmeden ders al, sonra bu kareyi yeni referans yap
                  if (pending == null && teachOn()) {
                      try { learnFromHuman(rd) } catch (e: Throwable) {}
                  }
                  lastRd = rd
                  if (teachOn()) {
                      val s0 = stored
                      if (s0 != null) {
                          var ra = refArr
                          if (ra == null || ra.size != s0.size) ra = ByteArray(s0.size)
                          System.arraycopy(s0, 0, ra, 0, s0.size)
                          refArr = ra
                      }
                  }
                  liftA = null
                  liftB = null
                  liftSlot = -1
                  // Önceki otomatik hamlenin sonucunu değerlendir
                  val pa = pending
                  if (pa != null) {
                      pending = null
                      if (!sameBoard(rd.board, pa.before)) {
                          fails = 0
                          calibrate(pa, rd.board)
                      } else {
                          fails++
                          probeY = 0.0
                          if (fails % 3 == 0) analyzer.forceFit = true
                          if (fails >= 2) {
                              // Beceremedi: kullanıcıdan iste, elle yerleştirince ondan öğrenecek
                              askUntil = SystemClock.uptimeMillis() + 45000
                              askBoard = rd.board.copyOf()
                              askPieces = rd.pieces
                              askMove = pa.move.idx
                          }
                      }
                  }

                  if (askBoard != null && askUntil > SystemClock.uptimeMillis()) {
                      autoNote = "SEN YAP: " + (askMove + 1).toString() + ". parcayi cerceveye koy, ben ogrenecegim"
                  } else if (autoNote.startsWith("SEN YAP")) {
                      autoNote = ""
                  }
                  val moves: List<Move> = if (rd.pieces.isEmpty()) emptyList() else Solver.solve(rd.board, rd.pieces)
                  val dx = analyzer.dx
                  val dy = analyzer.dy
                  val s = analyzer.s
                  overlayEmpty = false
                  val shapes = if (rd.pieces.isEmpty()) {
                      "parca yok"
                  } else {
                      rd.pieces.joinToString("  ") { (it.idx + 1).toString() + ":" + it.rows.joinToString(",") }
                  }
                  val oto = if (autoNote.isNotEmpty()) {
                      " | " + autoNote
                  } else if (auto) {
                      " | OTO " + learner.summary() + (if (fails > 0) " bas=" + fails.toString() else "") + (if (teachN > 0) " ders=" + teachN.toString() else "") + (if (corr.isNotEmpty()) " " + corr else "")
                  } else {
                      ""
                  }
                  val info = "S12 dy=" + dy.toInt().toString() + " | " + shapes + oto
                  ui.post { overlay?.update(moves, dx, dy, s, info) }

                  val ab = askBoard
                  if (ab != null && !sameBoard(ab, rd.board) && askPieces.any { landing(ab, it, rd.board) != null }) {
                      // Kullanıcı yerleştirdi: ders learnFromHuman'da alındı, otomatiğe dön
                      askBoard = null
                      askUntil = 0L
                      fails = 0
                  }
                  if (askUntil > SystemClock.uptimeMillis() && askBoard != null) {
                      autoNote = "SEN YAP: " + (askMove + 1).toString() + ". parcayi cerceveye koy, ben ogrenecegim"
                  } else {
                      if (askBoard != null) {
                          askBoard = null
                          fails = 0
                      }
                      if (auto && moves.isNotEmpty()) act(moves[0], rd)
                  }
              }

              private fun act(m: Move, rd: Reading) {
                  val svc = AutoTapService.instance
                  if (svc == null) {
                      autoNote = "OTO: erisilebilirlik izni kapali"
                      return
                  }
                  autoNote = ""
                  val p = m.p
                  val s = analyzer.s
                  val key = Learner.key(p)
                  val lo = learner.get(key)
                  val P = Analyzer.P
                  // Öğrenilmiş ofset çok saçmaysa (yükseğe fırlamasın) sınırla
                  val ox = lo[0].coerceIn(-1.2 * P, 1.2 * P)
                  val oy = lo[1].coerceIn(-2.2 * P, 2.2 * P)
                  val tx = ((Analyzer.CX0 + analyzer.dx + P * (m.c + p.gj) + ox) * s).toFloat()
                  val ty = ((Analyzer.CY0 + analyzer.dy + P * (m.r + p.gi) + oy) * s).toFloat()
                  val pend = Pending(m, rd.board.copyOf())
                  pend.probe = 0.0
                  pending = pend
                  busyUntil = SystemClock.uptimeMillis() + 20000
                  // Önce çerçevelerin ekranda çizilmesini bekle, sonra TAZE kareyi referans al
                  handler.postDelayed({
                      val rdr = reader
                      var arr: ByteArray? = null
                      if (rdr != null) {
                          val img = rdr.acquireLatestImage()
                          if (img != null) {
                              try {
                                  val pl = img.planes[0]
                                  val bb = pl.buffer
                                  bb.rewind()
                                  val bytes = ByteArray(bb.remaining())
                                  bb.get(bytes)
                                  arr = bytes
                                  sRs = pl.rowStride
                                  sPs = pl.pixelStride
                                  sW = img.width
                                  sH = img.height
                              } finally {
                                  img.close()
                              }
                          }
                      }
                      if (arr == null) arr = stored
                      val ref = if (arr != null) Frame(ByteBuffer.wrap(arr), sRs, sPs, sW, sH) else null
                      val lim = (1.8 * P * s).toFloat()
                      svc.dragRef(
                          p.gx.toFloat(), p.gy.toFloat(), tx, ty,
                          handler, lim, (sW - 1).toFloat(), (sH - 1).toFloat(), 9,
                          { fx, fy, tur -> if (ref == null) null else measureGhost(ref, pend, fx, fy, tur) },
                          { ok, ax, ay, meas ->
                              pend.ax = ax / s
                              pend.ay = ay / s
                              pend.measured = meas && ok
                              pend.released = ok
                              busyUntil = SystemClock.uptimeMillis() + 900
                              stable = 0
                              dirty = true
                          }
                      )
                  }, 450L)
              }

              /**
               * Parmak basılıyken (en çok 3 kare) hedef çerçevelerin içinin renk değişimine bakar.
               * Hepsi değiştiyse hazır=1 döner. Değilse değişen hücrelerin yerine göre kaydırma verir.
               * Hiç çerçeve değişimi yoksa kalkmış parçayı görüntüde arar (yedek yol).
               */
              private fun measureGhost(ref: Frame, pend: Pending, fx: Float, fy: Float, tur: Int): FloatArray? {
                  val rdr = reader ?: return null
                  val m = pend.move
                  val sc = analyzer.s
                  val gx = ArrayList<DoubleArray>()
                  val bx = ArrayList<DoubleArray>()
                  var gotImg = 0
                  for (k in 0 until 3) {
                      if (k > 0) Thread.sleep(90)
                      val img = rdr.acquireLatestImage() ?: continue
                      gotImg++
                      try {
                          val pl = img.planes[0]
                          val fr = Frame(pl.buffer, pl.rowStride, pl.pixelStride, img.width, img.height)
                          val g = analyzer.ghostShift(fr, ref, pend.before, m)
                          if (g != null) {
                              gx.add(g)
                          } else {
                              val e = analyzer.liftedError(fr, ref, m.p, m, fx.toDouble(), fy.toDouble())
                              if (e != null) bx.add(e)
                          }
                      } finally {
                          img.close()
                      }
                  }
                  if (gotImg == 0) {
                      // Ekran durağan, yeni kare yok: parmak aynı yerdeyse son ölçüm hâlâ geçerli
                      val lr = pend.lastRes
                      if (lr != null && pend.lastX == fx && pend.lastY == fy) return lr
                  }
                  pend.lastX = fx
                  pend.lastY = fy
                  pend.lastRes = null
                  if (gx.isNotEmpty()) {
                      // Son kare en güncel olandır; hazırsa hazır say
                      val last = gx[gx.size - 1]
                      pend.ghost = true
                      corr = "cerceve " + last[3].toInt().toString() + "/" + last[5].toInt().toString() + " fazla=" + last[4].toInt().toString() + " t" + tur.toString()
                      var res = floatArrayOf(last[0].toFloat(), last[1].toFloat(), 0f)
                      if (last[2] > 0.5) {
                          res = floatArrayOf(0f, 0f, 1f)
                      } else if (tur >= 1 && last[0] == 0.0 && last[1] == 0.0 && last[5] >= 3.0 && last[3] >= last[5] - 1.0 && last[4] <= 1.0) {
                          // Hedefte ama bir hücre boyanmadıysa (renk benzerliği) 2. turdan sonra yine bırak
                          res = floatArrayOf(0f, 0f, 1f)
                      }
                      pend.lastRes = res
                      return res
                  }
                  if (bx.isNotEmpty()) {
                      val xs = bx.map { it[0] }.sorted()
                      val ys = bx.map { it[1] }.sorted()
                      val mx = xs[xs.size / 2]
                      val my = ys[ys.size / 2]
                      val b = learner.bias(Learner.key(m.p))
                      corr = "parca duz=" + mx.toInt().toString() + "," + my.toInt().toString() + " t" + tur.toString()
                      // Yedek yolda yarım adımla yaklaş (aşmasın), hedef çok yakınsa dur
                      val ex = (mx + b[0] * sc)
                      val ey = (my + b[1] * sc)
                      val res2 = floatArrayOf((0.8 * ex).toFloat(), (0.8 * ey).toFloat(), 0f)
                      pend.lastRes = res2
                      return res2
                  }
                  corr = "gorunmedi t" + tur.toString()
                  return null
              }

              private fun forceOn(): Boolean = cfg.getBoolean("force", true)

              private fun teachOn(): Boolean = cfg.getBoolean("teach", true)

              /** Kullanıcı sürüklerken (otomatik değilken) her değişen karede kalkmış parçanın konumunu not eder. */
              private fun observe() {
                  val rd = lastRd ?: return
                  val ra = refArr ?: return
                  val arr = stored ?: return
                  if (rd.pieces.isEmpty() || ra.size != arr.size) return
                  val fr = Frame(ByteBuffer.wrap(arr), sRs, sPs, sW, sH)
                  val ref = Frame(ByteBuffer.wrap(ra), sRs, sPs, sW, sH)
                  val slot = analyzer.draggedSlot(fr, ref)
                  if (slot < 0) return
                  val p = rd.pieces.firstOrNull { it.idx == slot } ?: return
                  val b = analyzer.liftBlob(fr, ref, p, Double.NaN, Double.NaN) ?: return
                  if (analyzer.snapped(b[0], b[1])) return
                  liftSlot = slot
                  liftB = liftA
                  liftA = doubleArrayOf(b[0], b[1], SystemClock.uptimeMillis().toDouble())
              }

              /** Bir parça yerleşince: bırakmadan önceki havadaki konum ile oturduğu hücre merkezi farkını öğrenciye ver. */
              private fun learnFromHuman(rd: Reading) {
                  val before = lastRd ?: return
                  val la = liftA ?: return
                  val lb = liftB ?: return
                  if (SystemClock.uptimeMillis() - la[2] > 3000) return
                  if (sameBoard(before.board, rd.board)) return
                  val s = analyzer.s
                  val ddx = la[0] - lb[0]
                  val ddy = la[1] - lb[1]
                  if (Math.sqrt(ddx * ddx + ddy * ddy) > 0.15 * Analyzer.P * s) return
                  val p = before.pieces.firstOrNull { it.idx == liftSlot } ?: return
                  val at = landing(before.board, p, rd.board) ?: return
                  val t = analyzer.cellsCenter(at[0], at[1], p)
                  learner.teach(Learner.key(p), (la[0] - t[0]) / s, (la[1] - t[1]) / s)
                  teachN++
              }

              private fun landing(before: IntArray, p: Piece, after: IntArray): IntArray? {
                  var found = 0
                  var fr = 0
                  var fc = 0
                  for (r in 0..(8 - p.h)) {
                      for (c in 0..(8 - p.w)) {
                          var ok = true
                          for (i in 0 until p.h) {
                              if ((before[r + i] and (p.rows[i] shl c)) != 0) {
                                  ok = false
                                  break
                              }
                          }
                          if (!ok) continue
                          val nb = before.copyOf()
                          for (i in 0 until p.h) nb[r + i] = nb[r + i] or (p.rows[i] shl c)
                          Solver.clr(nb)
                          if (sameBoard(nb, after)) {
                              found++
                              fr = r
                              fc = c
                          }
                      }
                  }
                  return if (found == 1) intArrayOf(fr, fc) else null
              }

              private fun sameBoard(a: IntArray, b: IntArray): Boolean {
                  for (i in 0 until 8) {
                      if (a[i] != b[i]) return false
                  }
                  return true
              }

              /**
               * Hamle sonrası tahtadan parçanın gerçekte nereye düştüğünü bulur ve
               * sürükleme ofsetini buna göre düzeltir (parmağa göre yükselme gibi oyun davranışları için).
               */
              private fun calibrate(pa: Pending, after: IntArray) {
                  val p = pa.move.p
                  var found = 0
                  var fr = 0
                  var fc = 0
                  for (r in 0..(8 - p.h)) {
                      for (c in 0..(8 - p.w)) {
                          var ok = true
                          for (i in 0 until p.h) {
                              if ((pa.before[r + i] and (p.rows[i] shl c)) != 0) {
                                  ok = false
                                  break
                              }
                          }
                          if (!ok) continue
                          val nb = pa.before.copyOf()
                          for (i in 0 until p.h) nb[r + i] = nb[r + i] or (p.rows[i] shl c)
                          Solver.clr(nb)
                          if (sameBoard(nb, after)) {
                              found++
                              fr = r
                              fc = c
                          }
                      }
                  }
                  if (found != 1 && !pa.measured) {
                      probeY = 0.0
                      return
                  }
                  // İdeal düzeltme = deneme ofseti + döngünün ölçerek yaptığı kaydırma + bırakma sonrası hücre farkı
                  var ddx = 0.0
                  var ddy = 0.0
                  if (pa.measured) {
                      ddx += pa.ax
                      ddy += pa.ay
                  }
                  val key = Learner.key(p)
                  if (found == 1) {
                      val dr = fr - pa.move.r
                      val dc = fc - pa.move.c
                      val cxv = -dc * Analyzer.P
                      val cyv = -dr * Analyzer.P
                      ddx += cxv
                      ddy += cyv
                      if (pa.measured && !pa.ghost && (dr != 0 || dc != 0)) learner.addBias(key, cxv, cyv)
                  }
                  learner.update(key, ddx, ddy)
                  probeY = 0.0
              }

              private fun startForegroundCompat() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("cap", "Blok Yardımcısı", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(
                      this, 0,
                      Intent(this, CaptureService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  @Suppress("DEPRECATION")
                  val n = Notification.Builder(this, "cap")
                      .setContentTitle("Blok Yardımcısı çalışıyor")
                      .setContentText("Oyunu aç, öneriler ekranda görünür")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .addAction(Notification.Action.Builder(android.R.drawable.ic_delete, "Durdur", stopPi).build())
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { if (::handler.isInitialized) handler.removeCallbacksAndMessages(null) } catch (e: Throwable) {}
                  try { vd?.release() } catch (e: Throwable) {}
                  try { reader?.close() } catch (e: Throwable) {}
                  try { projection?.stop() } catch (e: Throwable) {}
                  try { overlay?.let { wm?.removeView(it) } } catch (e: Throwable) {}
                  try { thread.quitSafely() } catch (e: Throwable) {}
                  super.onDestroy()
              }
          }

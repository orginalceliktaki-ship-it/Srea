          package com.blok.yardimci

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Handler
          import android.view.accessibility.AccessibilityEvent

          /** Parçayı tepsiden alıp tahtaya sürükleyen dokunma servisi (Erişilebilirlik izni ister). */
          class AutoTapService : AccessibilityService() {
              companion object {
                  @Volatile
                  var instance: AutoTapService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun drag(x1: Float, y1: Float, x2: Float, y2: Float, dur: Long, done: (Boolean) -> Unit) {
                  val path = Path()
                  path.moveTo(x1, y1)
                  path.lineTo(x2, y2)
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, dur))
                      .build()
                  val ok = dispatchGesture(gesture, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          done(true)
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          done(false)
                      }
                  }, null)
                  if (!ok) done(false)
              }

              private fun seg(
                  prev: GestureDescription.StrokeDescription?,
                  fx: Float, fy: Float, tx: Float, ty: Float,
                  dur: Long, more: Boolean, worker: Handler,
                  onOk: () -> Unit, onFail: () -> Unit
              ): GestureDescription.StrokeDescription {
                  val path = Path()
                  path.moveTo(fx, fy)
                  if (Math.abs(tx - fx) + Math.abs(ty - fy) >= 1f) path.lineTo(tx, ty)
                  val st = if (prev == null) {
                      GestureDescription.StrokeDescription(path, 0L, dur, more)
                  } else {
                      prev.continueStroke(path, 0L, dur, more)
                  }
                  val g = GestureDescription.Builder().addStroke(st).build()
                  val ok = dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          onOk()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          onFail()
                      }
                  }, worker)
                  if (!ok) onFail()
                  return st
              }

              /**
               * Çerçeve referanslı sürükleme: parçayı tutar, hedefe yaklaştırır ve parmağı KALDIRMADAN bekler.
               * measure(x, y, tur) o anki ekrandan [kaymaX, kaymaY, hazir] verir (hazir=1 -> hedef çerçevelerin hepsi doldu).
               * Hazırsa BIRAKIR. Değilse parmak o kadar kaydırılır (hedeften en çok lim px uzaklaşır, yüksekliğe fırlamaz).
               * Hiçbir şekilde hazır olmazsa parçayı tepsiye geri götürüp bırakır (yanlış yere koymaz).
               */
              fun dragRef(
                  x1: Float, y1: Float, x2: Float, y2: Float,
                  worker: Handler, lim: Float, maxX: Float, maxY: Float, maxTur: Int,
                  measure: (Float, Float, Int) -> FloatArray?, done: (Boolean, Float, Float, Boolean) -> Unit
              ) {
                  var st: GestureDescription.StrokeDescription? = null
                  var cx = x2
                  var cy = y2
                  var measured = false
                  fun finish() {
                      st = seg(st, cx, cy, cx, cy, 80L, false, worker, { done(true, cx - x2, cy - y2, measured) }, { done(false, 0f, 0f, false) })
                  }
                  fun cancel() {
                      st = seg(st, cx, cy, x1, y1, 350L, false, worker, { done(false, cx - x2, cy - y2, measured) }, { done(false, 0f, 0f, false) })
                  }
                  fun refine(n: Int, nulls: Int) {
                      worker.postDelayed({
                          val e = try { measure(cx, cy, n) } catch (t: Throwable) { null }
                          if (e != null) measured = true
                          if (e != null && e.size >= 3 && e[2] > 0.5f) {
                              finish()
                          } else if (n >= maxTur) {
                              cancel()
                          } else if (e == null) {
                              if (nulls >= 3) cancel() else refine(n + 1, nulls + 1)
                          } else {
                              val nx = (cx + e[0]).coerceIn(maxOf(1f, x2 - lim), minOf(maxX, x2 + lim))
                              val ny = (cy + e[1]).coerceIn(maxOf(1f, y2 - lim), minOf(maxY, y2 + lim))
                              val moved = Math.abs(nx - cx) + Math.abs(ny - cy)
                              st = seg(st, cx, cy, nx, ny, if (moved < 1f) 60L else 220L, true, worker, { refine(n + 1, 0) }, { done(false, 0f, 0f, false) })
                              cx = nx
                              cy = ny
                          }
                      }, 280L)
                  }
                  st = seg(null, x1, y1, x2, y2, 450L, true, worker, { refine(0, 0) }, { done(false, 0f, 0f, false) })
              }
          }

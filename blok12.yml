          package com.blok.yardimci

          import android.content.Context
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sqrt

          /**
           * Hafif, cihaz içi, ücretsiz öğrenme (internet/API yok). Parmak -> blok kaymasını (ofset)
           * her parça şekli için çevrimiçi öğrenir. Model hiyerarşik: ofset = global + şekle özel sapma;
           * görülmemiş şekil global değerle başlar. Öğrenme oranı deneme arttıkça düşer ama tabanda kalır
           * (kilitlenip ezberlemez); hata beklenenden çok büyürse oran otomatik yükselir.
           * bx/by: görüntü ölçümünün şekle özel sapması (ölçüm hedefi hafif kayıksa onu düzeltir).
           * Her güncellemede telefona kaydedilir, uygulama kapanınca kaybolmaz.
           */
          class Learner(ctx: Context) {
              private class Stat {
                  var ox = 0.0
                  var oy = 0.0
                  var bx = 0.0
                  var by = 0.0
                  var n = 0
                  var err = 0.0
                  var dn = 0
              }

              private val prefs = ctx.getSharedPreferences("learn", Context.MODE_PRIVATE)
              private var tn = prefs.getInt("tn", 0)
              private val gl = Stat()
              private val map = HashMap<String, Stat>()
              private val maxD = 2.2 * Analyzer.P

              companion object {
                  fun key(p: Piece): String = p.h.toString() + "x" + p.w + ":" + p.rows.joinToString(",")
              }

              init {
                  load()
              }

              private fun load() {
                  val txt = prefs.getString("m", "") ?: ""
                  for (line in txt.split("\n")) {
                      val f = line.split("|")
                      if (f.size < 7) continue
                      try {
                          val st = if (f[0] == "_g") gl else Stat().also { map[f[0]] = it }
                          st.ox = f[1].toDouble()
                          st.oy = f[2].toDouble()
                          st.bx = f[3].toDouble()
                          st.by = f[4].toDouble()
                          st.n = f[5].toInt()
                          st.err = f[6].toDouble()
                          if (f.size >= 8) st.dn = f[7].toInt()
                      } catch (e: Throwable) {
                      }
                  }
              }

              private fun line(k: String, s: Stat): String =
                  k + "|" + s.ox + "|" + s.oy + "|" + s.bx + "|" + s.by + "|" + s.n + "|" + s.err + "|" + s.dn

              private fun save() {
                  val sb = StringBuilder(line("_g", gl))
                  for ((k, v) in map) sb.append("\n").append(line(k, v))
                  prefs.edit().putString("m", sb.toString()).apply()
              }

              /** Eski tek-ofset kalibrasyonunu yalnızca hiç öğrenme yokken başlangıç olarak alır. */
              fun seed(x: Double, y: Double) {
                  if (gl.n == 0 && map.isEmpty()) {
                      gl.ox = x
                      gl.oy = y
                  }
              }

              fun get(key: String): DoubleArray {
                  val st = map[key]
                  return doubleArrayOf(gl.ox + (st?.ox ?: 0.0), gl.oy + (st?.oy ?: 0.0))
              }

              fun bias(key: String): DoubleArray {
                  val st = map[key]
                  return doubleArrayOf(gl.bx + (st?.bx ?: 0.0), gl.by + (st?.by ?: 0.0))
              }

              fun addBias(key: String, x: Double, y: Double) {
                  val st = map.getOrPut(key) { Stat() }
                  st.bx = (st.bx + 0.5 * x).coerceIn(-Analyzer.P, Analyzer.P)
                  st.by = (st.by + 0.5 * y).coerceIn(-Analyzer.P, Analyzer.P)
              }

              /**
               * İnsan dersi: parçanın havadaki (kalkmış) görüntü merkezi ile yerleştiği hücre merkezi farkı (referans px).
               * Oyunun "görünen konum -> oturduğu hücre" eşlemesini doğrudan öğretir, o yüzden hızlı öğrenilir.
               */
              fun teach(key: String, bx: Double, by: Double) {
                  if (sqrt(bx * bx + by * by) > 1.2 * Analyzer.P) return
                  val st = map.getOrPut(key) { Stat() }
                  val cur = bias(key)
                  val ex = bx - cur[0]
                  val ey = by - cur[1]
                  val lr = if (st.dn == 0) 0.7 else 0.4
                  st.bx = (st.bx + (lr - 0.15) * ex).coerceIn(-Analyzer.P, Analyzer.P)
                  st.by = (st.by + (lr - 0.15) * ey).coerceIn(-Analyzer.P, Analyzer.P)
                  gl.bx = (gl.bx + 0.15 * ex).coerceIn(-Analyzer.P, Analyzer.P)
                  gl.by = (gl.by + 0.15 * ey).coerceIn(-Analyzer.P, Analyzer.P)
                  st.dn++
                  gl.dn++
                  tn++
                  prefs.edit().putInt("tn", tn).apply()
                  save()
              }

              /** dx, dy: kullanılan ofsete eklenmesi gereken ideal düzeltme (1080 referans pikseli). */
              fun update(key: String, dx: Double, dy: Double) {
                  val mag = sqrt(dx * dx + dy * dy)
                  if (mag > maxD) return
                  val st = map.getOrPut(key) { Stat() }
                  val glr = max(0.05, 1.0 / (gl.n + 3.0))
                  var lr = max(0.15, 1.0 / (st.n + 1.5))
                  if (st.n >= 4 && mag > 2.5 * st.err + 6.0) lr = min(0.6, lr * 2.0)
                  gl.ox += glr * dx
                  gl.oy += glr * dy
                  st.ox += lr * (1.0 - glr) * dx
                  st.oy += lr * (1.0 - glr) * dy
                  st.err = if (st.n == 0) mag else 0.7 * st.err + 0.3 * mag
                  gl.err = if (gl.n == 0) mag else 0.8 * gl.err + 0.2 * mag
                  st.n++
                  gl.n++
                  save()
              }

              /** Ekranda gösterilen takip özeti: öğrenilen hamle, şekil sayısı, ortalama kalan hata. */
              fun summary(): String = "ogr n=" + gl.n + " s=" + map.size + " hata=" + gl.err.toInt() + "px ders=" + tn
          }

name: Blok APK 12

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'BLOK_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.blok.yardimci"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.blok.yardimci6"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 12
                  versionName = "12"
              }

              signingConfigs {
                  create("fixed") {
                      storeFile = file("debug.keystore")
                      storeType = "pkcs12"
                      storePassword = "blokyardimci"
                      keyAlias = "blok"
                      keyPassword = "blokyardimci"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("fixed")
                  }
                  getByName("release") {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          BLOK_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'BLOK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Blok Yardımcısı 12"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".AutoTapService"
                      android:exported="true"
                      android:label="Blok Yardımcısı 12 otomatik dokunma"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          BLOK_EOF
          mkdir -p app/src/main/java/com/blok/yardimci
          cat > app/src/main/java/com/blok/yardimci/Analyzer.kt <<'BLOK_EOF'
          package com.blok.yardimci

          import java.nio.ByteBuffer
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          class Frame(
              private val buf: ByteBuffer,
              private val rs: Int,
              private val ps: Int,
              val w: Int,
              val h: Int
          ) {
              fun r(x: Int, y: Int): Int = buf.get(y * rs + x * ps).toInt() and 0xFF
              fun g(x: Int, y: Int): Int = buf.get(y * rs + x * ps + 1).toInt() and 0xFF
              fun b(x: Int, y: Int): Int = buf.get(y * rs + x * ps + 2).toInt() and 0xFF
          }

          /**
           * Ekran görüntüsünden 8x8 tahtayı ve alttaki 3 parçayı okur.
           * Koordinatlar 1080 piksel genişlikteki referans yerleşime göredir, ekrana oranlanır.
           */
          class Analyzer {
              companion object {
                  const val P = 118.6
                  const val CX0 = 125.0
                  const val CY0 = 975.0
              }

              var dx = 0.0
              var dy = 0.0
              var s = 1.0
              private var qCount = 0
              private lateinit var f: Frame
              private val tmp = IntArray(3)

              private fun cx(c: Int) = (CX0 + dx + P * c) * s
              private fun cy(r: Int) = (CY0 + dy + P * r) * s

              private fun avg(x: Double, y: Double, rad: Int): IntArray {
                  var rr = 0
                  var gg = 0
                  var bb = 0
                  var n = 0
                  var j = -rad
                  while (j <= rad) {
                      var i = -rad
                      while (i <= rad) {
                          val xx = min(f.w - 1, max(0, (x + i).roundToInt()))
                          val yy = min(f.h - 1, max(0, (y + j).roundToInt()))
                          rr += f.r(xx, yy)
                          gg += f.g(xx, yy)
                          bb += f.b(xx, yy)
                          n++
                          i += 2
                      }
                      j += 2
                  }
                  tmp[0] = rr / n
                  tmp[1] = gg / n
                  tmp[2] = bb / n
                  return tmp
              }

              private fun mx(c: IntArray): Int = max(c[0], max(c[1], c[2]))

              private fun filled(c: IntArray): Boolean {
                  val m = mx(c)
                  val n = min(c[0], min(c[1], c[2]))
                  return m / 255.0 > 0.58 && (m - n).toDouble() / m > 0.3
              }

              private fun bright(x: Int, y: Int): Boolean {
                  if (x < 0 || y < 0 || x >= f.w || y >= f.h) return false
                  val r = f.r(x, y)
                  val g = f.g(x, y)
                  val b = f.b(x, y)
                  val m = max(r, max(g, b))
                  val n = min(r, min(g, b))
                  return m > 153 && (m - n).toDouble() / m > 0.4
              }

              /** Izgara doğru hizalıysa yüksek değer verir; qCount = belirgin hücre sayısı (64 üzerinden). */
              private fun quality(): Double {
                  var sum = 0.0
                  var cnt = 0
                  val half = P * s / 2
                  for (r in 0..7) {
                      for (c in 0..7) {
                          val x = cx(c)
                          val y = cy(r)
                          val m = mx(avg(x, y, 2))
                          val gv = mx(avg(x, if (r < 7) y + half else y - half, 1))
                          val gh = mx(avg(if (c < 7) x + half else x - half, y, 1))
                          val d = m - max(gv, gh)
                          if (d > 25) cnt++
                          sum += d.coerceIn(-30, 60)
                      }
                  }
                  qCount = cnt
                  return sum
              }

              private fun fit(): Boolean {
                  var bx = 0.0
                  var by = 0.0
                  var bs = -1e18
                  var a = -40
                  while (a <= 40) {
                      var b = -250
                      while (b <= 250) {
                          dx = a.toDouble()
                          dy = b.toDouble()
                          val q = quality()
                          if (q > bs) {
                              bs = q
                              bx = dx
                              by = dy
                          }
                          b += 6
                      }
                      a += 6
                  }
                  val cx0 = bx
                  val cy0 = by
                  bs = -1e18
                  for (a2 in -5..5) {
                      for (b2 in -5..5) {
                          dx = cx0 + a2
                          dy = cy0 + b2
                          val q = quality()
                          if (q > bs) {
                              bs = q
                              bx = dx
                              by = dy
                          }
                      }
                  }
                  dx = bx
                  dy = by
                  quality()
                  return qCount >= 58
              }

              /** [start, end] aralıklarını döner: eşiği geçen ardışık bölgeler, kısa boşluklar birleştirilir, kısa bölgeler atılır. */
              private fun segments(v: IntArray, thr: Int, gapMin: Int, lenMin: Int): List<IntArray> {
                  val out = ArrayList<IntArray>()
                  var st = -1
                  var last = -1
                  for (k in v.indices) {
                      if (v[k] >= thr) {
                          if (st < 0) st = k
                          last = k
                      } else if (st >= 0 && k - last >= gapMin) {
                          out.add(intArrayOf(st, last))
                          st = -1
                      }
                  }
                  if (st >= 0) out.add(intArrayOf(st, last))
                  return out.filter { it[1] - it[0] + 1 >= lenMin }
              }

              /**
               * Tepsideki bir parçayı okur. Hücre boyutunu tahmin etmez: parlak piksellerin
               * sütun ve satır izdüşümlerindeki boşluklardan hücre sınırlarını bulur.
               * Hızlı olması için her iki yönde de 2 pikselde bir örnekler.
               */
              private fun readPiece(i: Int): Piece? {
                  val x0 = ((85 + 315 * i + dx) * s).roundToInt().coerceAtLeast(0)
                  val x1 = min(f.w, (x0 + 283 * s).roundToInt())
                  val y0 = ((CY0 + dy + 950) * s).roundToInt().coerceAtLeast(0)
                  val y1 = min(f.h, ((CY0 + dy + 1152) * s).roundToInt())
                  val nx = (x1 - x0) / 2
                  val ny = (y1 - y0) / 2
                  if (nx < 10 || ny < 10) return null
                  val colCnt = IntArray(nx)
                  val rowCnt = IntArray(ny)
                  for (ky in 0 until ny) {
                      val y = y0 + ky * 2
                      for (kx in 0 until nx) {
                          if (bright(x0 + kx * 2, y)) {
                              colCnt[kx]++
                              rowCnt[ky]++
                          }
                      }
                  }
                  val gapMin = max(2, (3 * s).roundToInt())
                  val lenMin = max(6, (10 * s).roundToInt())
                  val cs = segments(colCnt, max(2, (3 * s).roundToInt()), gapMin, lenMin)
                  val rs = segments(rowCnt, max(5, (10 * s).roundToInt()), gapMin, lenMin)
                  if (cs.isEmpty() || rs.isEmpty() || cs.size > 5 || rs.size > 5) return null
                  val rows = IntArray(rs.size)
                  var any = false
                  val bcx = x0 + (cs[0][0] + cs[cs.size - 1][1]).toDouble()
                  val bcy = y0 + (rs[0][0] + rs[rs.size - 1][1]).toDouble()
                  var bestD = 1e18
                  var gi = 0
                  var gj = 0
                  var gx = bcx
                  var gy = bcy
                  for (ri in rs.indices) {
                      for (ci in cs.indices) {
                          val cxp = x0 + (cs[ci][0] + cs[ci][1]).toDouble()
                          val cyp = y0 + (rs[ri][0] + rs[ri][1]).toDouble()
                          if (filled(avg(cxp, cyp, max(2, (5 * s).roundToInt())))) {
                              rows[ri] = rows[ri] or (1 shl ci)
                              any = true
                              val d = (cxp - bcx) * (cxp - bcx) + (cyp - bcy) * (cyp - bcy)
                              if (d < bestD) {
                                  bestD = d
                                  gi = ri
                                  gj = ci
                                  gx = cxp
                                  gy = cyp
                              }
                          }
                      }
                  }
                  if (!any) return null
                  return Piece(i, rs.size, cs.size, rows, gx, gy, gi, gj)
              }

              private fun q(x: Int, y: Int): Long {
                  val xx = min(f.w - 1, max(0, x))
                  val yy = min(f.h - 1, max(0, y))
                  return (((f.r(xx, yy) shr 4) shl 8) or ((f.g(xx, yy) shr 4) shl 4) or (f.b(xx, yy) shr 4)).toLong()
              }

              /** Tahta hücre merkezlerinden ve tepsiden seyrek örnek alıp özet üretir. Ekran değişmediyse aynı çıkar. */
              fun quickHash(frame: Frame): Long {
                  f = frame
                  s = frame.w / 1080.0
                  var hsh = -3750763034362895579L
                  for (r in 0..7) {
                      for (c in 0..7) {
                          hsh = (hsh xor q(cx(c).roundToInt(), cy(r).roundToInt())) * 1099511628211L
                      }
                  }
                  val step = max(6, (14 * s).roundToInt())
                  for (i in 0..2) {
                      val x0 = ((85 + 315 * i + dx) * s).roundToInt()
                      val x1 = (x0 + 283 * s).roundToInt()
                      val y0 = ((CY0 + dy + 950) * s).roundToInt()
                      val y1 = ((CY0 + dy + 1152) * s).roundToInt()
                      var y = y0
                      while (y < y1) {
                          var x = x0
                          while (x < x1) {
                              hsh = (hsh xor q(x, y)) * 1099511628211L
                              x += step
                          }
                          y += step
                      }
                  }
                  return hsh
              }

              var forceFit = false

              private fun brightIn(fr: Frame, x: Int, y: Int): Boolean {
                  if (x < 0 || y < 0 || x >= fr.w || y >= fr.h) return false
                  val r = fr.r(x, y)
                  val g = fr.g(x, y)
                  val b = fr.b(x, y)
                  val m = max(r, max(g, b))
                  val n = min(r, min(g, b))
                  return m > 153 && (m - n).toDouble() / m > 0.4
              }

              /** Sürükleme sırasında tepsiden hangi yuvanın parçası kalktı: en çok değişen yuva, yoksa -1. */
              fun draggedSlot(frame: Frame, ref: Frame): Int {
                  s = frame.w / 1080.0
                  val step = max(3, (4 * s).roundToInt())
                  var best = -1
                  var bc = 24
                  for (i in 0..2) {
                      val x0 = ((85 + 315 * i + dx) * s).roundToInt().coerceAtLeast(0)
                      val x1 = min(frame.w, (x0 + 283 * s).roundToInt())
                      val y0 = ((CY0 + dy + 950) * s).roundToInt().coerceAtLeast(0)
                      val y1 = min(frame.h, ((CY0 + dy + 1152) * s).roundToInt())
                      var c = 0
                      var y = y0
                      while (y < y1) {
                          var x = x0
                          while (x < x1) {
                              if (brightIn(ref, x, y)) {
                                  val d = abs(frame.r(x, y) - ref.r(x, y)) + abs(frame.g(x, y) - ref.g(x, y)) + abs(frame.b(x, y) - ref.b(x, y))
                                  if (d > 90) c++
                              }
                              x += step
                          }
                          y += step
                      }
                      if (c > bc) {
                          bc = c
                          best = i
                      }
                  }
                  return best
              }

              /**
               * Kalkmış parçayı bulur: sürükleme öncesi kareye göre DEĞİŞMİŞ, parlak ve (varsa) parçanın
               * kendi rengindeki pikselleri bağlı bileşenlere ayırır. Boyutu parçaya uyan bileşenlerden
               * parmağa (hx,hy) en yakın olanı, ipucu yoksa en kalabalık olanı seçer. Döner: [merkezX, merkezY, genişlik, yükseklik].
               */
              private fun blobs(frame: Frame, ref: Frame, p: Piece, useColor: Boolean, hx: Double, hy: Double): DoubleArray? {
                  val pc = IntArray(3)
                  if (useColor) {
                      f = ref
                      val a = avg(p.gx, p.gy, 4)
                      pc[0] = a[0]
                      pc[1] = a[1]
                      pc[2] = a[2]
                      f = frame
                  }
                  val step = max(3, (4 * s).roundToInt())
                  val y0 = max(0, (cy(0) - P * s / 2 - 450 * s).roundToInt())
                  val y1 = min(frame.h, (cy(7) + P * s / 2 + 40 * s).roundToInt())
                  val nx = frame.w / step
                  val ny = (y1 - y0) / step
                  if (nx < 10 || ny < 10) return null
                  val mask = BooleanArray(nx * ny)
                  for (ky in 0 until ny) {
                      val y = y0 + ky * step
                      for (kx in 0 until nx) {
                          val x = kx * step
                          if (!brightIn(frame, x, y)) continue
                          val r = frame.r(x, y)
                          val g = frame.g(x, y)
                          val b = frame.b(x, y)
                          if (abs(r - ref.r(x, y)) + abs(g - ref.g(x, y)) + abs(b - ref.b(x, y)) < 90) continue
                          if (useColor && abs(r - pc[0]) + abs(g - pc[1]) + abs(b - pc[2]) > 120) continue
                          mask[ky * nx + kx] = true
                      }
                  }
                  val seen = BooleanArray(nx * ny)
                  val stack = IntArray(nx * ny)
                  val ew = p.w * P * s
                  val eh = p.h * P * s
                  val rad = max(2, (12 * s / step).roundToInt())
                  var best: DoubleArray? = null
                  var bestScore = -1e18
                  for (start in mask.indices) {
                      if (!mask[start] || seen[start]) continue
                      var sp = 0
                      stack[sp++] = start
                      seen[start] = true
                      var minX = nx
                      var maxX = -1
                      var minY = ny
                      var maxY = -1
                      var mass = 0
                      while (sp > 0) {
                          val cur = stack[--sp]
                          val qy = cur / nx
                          val qx = cur % nx
                          mass++
                          if (qx < minX) minX = qx
                          if (qx > maxX) maxX = qx
                          if (qy < minY) minY = qy
                          if (qy > maxY) maxY = qy
                          for (jy in max(0, qy - rad)..min(ny - 1, qy + rad)) {
                              for (jx in max(0, qx - rad)..min(nx - 1, qx + rad)) {
                                  val id = jy * nx + jx
                                  if (mask[id] && !seen[id]) {
                                      seen[id] = true
                                      stack[sp++] = id
                                  }
                              }
                          }
                      }
                      if (mass < 40) continue
                      val wpx = (maxX - minX + 1) * step
                      val hpx = (maxY - minY + 1) * step
                      if (wpx < 0.4 * ew || wpx > 1.8 * ew || hpx < 0.4 * eh || hpx > 1.8 * eh) continue
                      if (mass.toDouble() * step * step / (wpx.toDouble() * hpx) < 0.25) continue
                      val ccx = (minX + maxX) / 2.0 * step
                      val ccy = y0 + (minY + maxY) / 2.0 * step
                      val sc = if (hx.isNaN()) mass.toDouble() else -((ccx - hx) * (ccx - hx) + (ccy - hy) * (ccy - hy))
                      if (sc > bestScore) {
                          bestScore = sc
                          best = doubleArrayOf(ccx, ccy, wpx.toDouble(), hpx.toDouble())
                      }
                  }
                  return best
              }

              fun liftBlob(frame: Frame, ref: Frame, p: Piece, hx: Double, hy: Double): DoubleArray? {
                  f = frame
                  s = frame.w / 1080.0
                  return blobs(frame, ref, p, true, hx, hy) ?: blobs(frame, ref, p, false, hx, hy)
              }

              /** Kalkmış parçanın merkezinin hedef hücre merkezine uzaklığı (px): [ex, ey]. Bulunamazsa null. */
              fun liftedError(frame: Frame, ref: Frame, p: Piece, m: Move, hx: Double, hy: Double): DoubleArray? {
                  val bl = liftBlob(frame, ref, p, hx, hy) ?: return null
                  val t = cellsCenter(m.r, m.c, p)
                  val ex = t[0] - bl[0]
                  val ey = t[1] - bl[1]
                  if (abs(ex) > 600 * s || abs(ey) > 600 * s) return null
                  return doubleArrayOf(ex, ey)
              }

              /**
               * Sürükleme sırasında ÇERÇEVE kontrolü. Tahtadaki boş hücrelerin merkez rengi, sürükleme öncesi kareye (ref)
               * göre değişti mi bakar (oyunun yerleşim önizlemesi / üstteki parça hücreyi boyar).
               * Döner: [kaymaX, kaymaY, hazir(1/0), isabet, fazla] px; hiçbir hücre değişmediyse null.
               * hazir=1: hedef hücrelerin HEPSİ aynı anda değişti, parça tam hedefte -> bırakılabilir.
               * Değilse: değişen hücrelerin oturduğu yer ile hedef arasındaki fark kadar kaydırma önerir.
               */
              fun ghostShift(frame: Frame, ref: Frame, before: IntArray, m: Move): DoubleArray? {
                  s = frame.w / 1080.0
                  val rad = max(2, (10 * s).roundToInt())
                  val ch = IntArray(8)
                  var total = 0
                  for (r in 0..7) {
                      for (c in 0..7) {
                          if (((before[r] shr c) and 1) != 0) continue
                          val x = cx(c)
                          val y = cy(r)
                          f = frame
                          val a0 = avg(x, y, rad)
                          val a = intArrayOf(a0[0], a0[1], a0[2])
                          f = ref
                          val b = avg(x, y, rad)
                          val d = abs(a[0] - b[0]) + abs(a[1] - b[1]) + abs(a[2] - b[2])
                          if (d > 30) {
                              ch[r] = ch[r] or (1 shl c)
                              total++
                          }
                      }
                  }
                  f = frame
                  if (total == 0) return null
                  val p = m.p
                  var cellsN = 0
                  for (i in 0 until p.h) cellsN += Integer.bitCount(p.rows[i])
                  var bestScore = -1e9
                  var br = m.r
                  var bc = m.c
                  var bh = 0
                  var be = total
                  for (r in 0..(8 - p.h)) {
                      for (c in 0..(8 - p.w)) {
                          var hits = 0
                          for (i in 0 until p.h) hits += Integer.bitCount((p.rows[i] shl c) and ch[r + i])
                          val extra = total - hits
                          val dist = abs(r - m.r) + abs(c - m.c)
                          val sc = 3.0 * hits - 2.0 * extra - 0.01 * dist
                          if (sc > bestScore) {
                              bestScore = sc
                              br = r
                              bc = c
                              bh = hits
                              be = extra
                          }
                      }
                  }
                  if (bh == 0) return null
                  val ready = if (br == m.r && bc == m.c && bh >= cellsN && be <= max(2, cellsN)) 1.0 else 0.0
                  // Parça hedefte ama bazı hücreler boyanmamışsa küçük bir yarım hücre kaydırması yapma, bekle
                  // Çift boyutlu parçada (ör. 4'lü dikey) merkez iki hücre arasındadır; tam 1 hücre kaydırmak
                  // yine eşitlik noktasına düşüp bir kare yukarıya oturtur. Bu yüzden 0.65 hücre kaydır, eşitliğin ötesine geç.
                  val kx = if (abs(m.c - bc) == 1 && p.w % 2 == 0) 0.65 else 1.0
                  val ky = if (abs(m.r - br) == 1 && p.h % 2 == 0) 0.65 else 1.0
                  val ex = (m.c - bc) * P * s * kx
                  val ey = (m.r - br) * P * s * ky
                  return doubleArrayOf(ex, ey, ready, bh.toDouble(), be.toDouble(), cellsN.toDouble())
              }

              fun cellsCenter(r: Int, c: Int, p: Piece): DoubleArray =
                  doubleArrayOf((cx(c) + cx(c + p.w - 1)) / 2.0, (cy(r) + cy(r + p.h - 1)) / 2.0)

              /** Merkez yarım hücre ızgarasına neredeyse oturuyorsa parça yerleşmiş demektir (havada değil). */
              fun snapped(bx: Double, by: Double): Boolean {
                  val u = (bx / s - CX0 - dx) / P * 2.0
                  val v = (by / s - CY0 - dy) / P * 2.0
                  return abs(u - u.roundToInt()) < 0.12 && abs(v - v.roundToInt()) < 0.12
              }

              fun analyze(frame: Frame): Reading? {
                  f = frame
                  s = frame.w / 1080.0
                  quality()
                  if (qCount < 60 || forceFit) {
                  forceFit = false
                  if (!fit()) return null
                  }
                  val board = IntArray(8)
                  val rad = (8 * s).roundToInt()
                  for (r in 0..7) {
                      for (c in 0..7) {
                          if (filled(avg(cx(c), cy(r), rad))) board[r] = board[r] or (1 shl c)
                      }
                  }
                  val pieces = ArrayList<Piece>()
                  for (i in 0..2) {
                      val p = readPiece(i)
                      if (p != null) pieces.add(p)
                  }
                  return Reading(board, pieces)
              }
          }
